name: vision_football
description: AR penalty kick football game using ML Kit pose detection and Flame.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_pose_detection: ^0.14.1
  camera: ^0.12.0+1
  flame: ^1.37.0
  sensors_plus: ^7.0.0
  vector_math: ^2.2.0
  app_settings: ^7.0.0
  audioplayers: ^6.7.1
  wakelock_plus: ^1.6.1
  country_flags: ^4.1.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/VisionFootball-Logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/VisionFootball-Logo.png
  # iOS icons must be fully opaque (no alpha). Flatten any transparency onto
  # black so the App Store accepts the icon.
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/images/goal_post.png
    - assets/images/stadium_crowd.png
