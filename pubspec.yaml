name: vision_football
description: AR penalty kick football game using ML Kit pose detection and Flame.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_pose_detection: ^0.14.1
  camera: ^0.12.0+1
  flame: ^1.37.0
  sensors_plus: ^7.0.0
  vector_math: ^2.2.0
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/goal_post.png
